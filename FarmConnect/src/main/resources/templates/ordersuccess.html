<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - FarmConnect</title>
    <link rel="stylesheet" th:href="@{/css/checkout.css}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <div class="bg-green-50 min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
            <div class="mb-6">
                <i class="fas fa-check-circle text-green-600 text-6xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Order Placed Successfully!</h1>
            <p class="text-gray-600 mb-6">Your order has been confirmed and will be processed shortly.</p>
            <a href="/"
                class="inline-block bg-green-700 text-white py-3 px-6 rounded-md font-semibold hover:bg-green-800 transition duration-300">Continue
                Shopping</a>
        </div>
    </div>
</body>

</html>
